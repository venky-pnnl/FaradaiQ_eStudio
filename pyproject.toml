[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faradaiq-estudio-local"
version = "0.331.0"
description = "FaradaIQ eStudio local bundle for electrochemical data analysis and visualization"
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
faradaiq-estudio = "faradaiq.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["faradaiq*"]

[tool.setuptools.package-data]
faradaiq = ["skills/*.md", "skills/*.json", "skills/*.py"]
