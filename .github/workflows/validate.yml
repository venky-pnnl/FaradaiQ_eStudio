name: Validate eStudio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  github-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          export ESTUDIO_PWSH="$(command -v pwsh)"
          test -n "$ESTUDIO_PWSH"
          python tests/test_github_setup.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy==1.26.4 pandas==2.2.2 scipy==1.13.1 matplotlib==3.8.4 pillow==10.3.0 contourpy==1.2.0 h5py==3.11.0 cvxpy==1.6.7 openpyxl python-pptx python-docx plotly impedance -r requirements_browser.txt
      - name: Unit contracts
        run: python scripts/test_release.py -q
      - name: Live GUI workflows
        run: python tests/gui_estudio_v341.py
      - name: Build release and verify manifest
        run: |
          python scripts/build_release.py
          ./scripts/verify.ps1 -Root $PWD
          ./scripts/install.ps1 -Root $PWD -Plan
      - name: Windows PowerShell 5.1 empty-root regression
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          foreach ($script in @('scripts/distribute.ps1', 'scripts/github_cli_portable.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script), [ref] $tokens, [ref] $parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors -join [Environment]::NewLine) }
          }
          ./scripts/install.ps1 -Root '' -Plan
          cmd /c Install_FaradaIQ_eStudio_v341.bat -Plan
      - uses: actions/upload-artifact@v4
        with:
          name: FaradaIQ-eStudio-v341-package
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest numpy==1.26.4 pandas==2.2.2 scipy==1.13.1 matplotlib==3.8.4 pillow==10.3.0 contourpy==1.2.0 h5py==3.11.0 cvxpy==1.6.7 openpyxl python-pptx python-docx plotly impedance -r requirements_browser.txt
      - run: python scripts/test_release.py -q
      - name: Build and validate macOS installation plan
        run: |
          python scripts/build_release.py
          bash -n Install_FaradaIQ_eStudio_v341.command
          bash -n Start_FaradaIQ_eStudio_v341.sh
          bash -n Start_FaradaIQ_eStudio_Browser_v341.command
          bash Install_FaradaIQ_eStudio_v341.sh --plan
